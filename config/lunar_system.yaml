groundgrid:
  map_dimension: 60.0
  map_resolution: 0.15
  map_frame: map
  base_frame: base_link
  sensor_frame: velodyne
  point_cloud_topic: /sensors/velodyne_points
  odometry_topic: /localization/odometry/filtered_map
  thread_count: 8
  minimum_distance_factor: 0.005
  distance_factor: 0.0005
  # Upstream default is sqrt(12) = 3.46 m, sized for a car with a roof LiDAR. On a 1.8 m
  # rover that discards every point inside two body lengths: `points` stays 0 so no ground
  # patch is ever detected, and `maxGroundHeight` stays at lowest() so obstacle_height
  # computes as 0 and obstacle_confidence decays away -- the rover drives into rocks it
  # measured perfectly well a second earlier. 1.2 m is the body half-diagonal (1.17 m),
  # i.e. the radius inside which a return could only be the vehicle itself.
  min_point_distance: 1.2
  slope_enable: true
  height_correction_enable: true
  height_correction_iterations: 1
  slope_aware_tolerance_enable: true
  slope_max_traversable_deg: 20.0

lunar_traversability:
  input_topic: /groundgrid/grid_map
  grid_map_topic: /terrain/grid_map
  costmap_topic: /terrain/costmap
  max_longitudinal_slope_deg: 20.0
  max_roughness: 0.08
  max_step_height: 0.20
  min_ground_confidence: 0.0
  # groundgrid runs ~1.05 s/frame, so a 1.0 s tolerance invalidated a cell the instant
  # one frame missed it -- and the rings shift under the vehicle every frame.
  max_observation_age: 3.0
  # Half the LiDAR's inter-ring ground spacing at the working range. See the comment in
  # LunarTraversabilityNode::mapCallback: past r where (h + r^2/h)*beam_pitch > 2*this,
  # the costmap is legitimately unknown. 1.0 m puts that edge at ~16 m.
  observation_fill_radius: 1.0
  # No beam lands inside this disc (1.0 m mounting height / -24.8 deg lowest beam gives
  # 2.16 m), so it is never observed and the rover could not take its first step.
  sensor_blind_radius: 2.5
  min_obstacle_height: 0.10
  min_obstacle_confidence: 0.45

state_lattice_planner:
  map_frame: map
  base_frame: base_link
  heading_bins: 16
  primitive_length: 0.45
  # Weighted-A* inflation. >1 trades path optimality for far fewer expansions, so
  # distant goals are reached within the planning budget. Bounded suboptimality ~2x.
  heuristic_weight: 2.0
  reverse_cost: 1.3
  rotation_cost: 1.5
  max_planning_time: 1.0
  # Reject the map only if its stamp is older than this. Perception (groundgrid)
  # runs ~1.1s/frame, so a 1s gate marked every map stale; 3s leaves headroom.
  max_map_age: 3.0
  footprint_length: 1.8
  footprint_width: 1.5
  max_longitudinal_slope_deg: 20.0
  max_lateral_slope_deg: 15.0
  # A/B switch: false = legacy ideal-arc primitives (transition()),
  # true = dynamics-feasible motion primitive library (requires motion_primitive_file).
  use_dynamics_primitives: false
  motion_primitive_file: motion_primitives.dat
  # Arc mode has no offline (v, w) library, so the planner profiles its own path.
  # Hard limits come from the shared skid_steer_model block; these only shape how much
  # speed rough or steep terrain sheds on top of that.
  terrain_speed_gain: 0.6    # fraction of v_max shed at the worst non-lethal terrain cost
  min_speed_scale: 0.25      # floor on the terrain factor, so the rover never crawls
  reverse_speed_frac: 0.5    # reversing is blind; cap it well under v_max
  # 要点13 (planning near obstacles): a goal whose footprint clips an unobserved or lethal
  # cell is nudged onto the nearest valid pose instead of failing outright. The bound is one
  # body half-diagonal (hypot(0.9,0.75)=1.17m) plus margin -- past that the goal really was
  # unreachable and failing is the honest answer.
  max_snap_distance: 1.5
  goal_snap_heading_span: 2       # heading bins searched either side of the requested one
  goal_snap_heading_weight: 0.25  # penalty per bin of heading deviation
  goal_snap_cost_weight: 0.5      # prefer low-terrain-cost snap targets
  # 异常检测与恢复 (软件设计9, 避障恢复率). The map refreshes at ~1.1s while the planner
  # reacts per frame, so a single failure is usually a transient: require a streak before
  # declaring the rover stuck, and repeated success before declaring it recovered.
  recovery_fail_threshold: 3      # consecutive plan() failures before entering recovery
  no_progress_timeout: 6.0        # s without closing on the goal before entering recovery
  progress_epsilon: 0.10          # m of goal-distance improvement that counts as progress
  recovery_step_timeout: 2.0      # s per escalation rung before escalating
  recovery_confirm_count: 2       # consecutive successes needed to leave recovery
  min_recovery_interval: 3.0      # s of nominal operation required between recoveries
  # Escalation rungs that command motion. The rotate probe is deliberately smaller than a
  # heading bin pair so it changes the outgoing primitive set without a large blind sweep;
  # the back-out distance is roughly one body length, enough to leave a pinch point but
  # short enough that it stays on ground the rover just drove over.
  recovery_rotate_step: 0.6       # rad of in-place turn per rotate attempt
  recovery_backout_distance: 1.0  # m retraced along the last successful path

lunar_path_follower:
  map_frame: map
  base_frame: base_link
  lookahead: 0.8
  max_linear_speed: 1.39   # ~5 km/h operating domain (indicator 10); capped by planned v-profile
  max_angular_speed: 0.8
  goal_position_tolerance: 0.25
  goal_yaw_tolerance: 0.174532925
  path_timeout: 1.0

# Skid-steer slip dynamics (ICR model). Shared by the motion primitive generator,
# the planner (feasibility / cost) and the follower (feed-forward). These are the
# "dynamics constraint parameter set" required by the comparison experiments; they
# are overwritten by scripts/identify_skidsteer.py once identification is run.
skid_steer_model:
  x_icr: 0.0               # ICR longitudinal offset [m]
  alpha_v: 1.0             # longitudinal slip efficiency (effective v = alpha_v * v_cmd)
  alpha_w: 1.0             # yaw slip efficiency (effective w = alpha_w * w_cmd)
  slope_slip_gain: 0.0     # lateral downslope drift per unit lateral gradient
  slope_grade_gain: 0.0    # longitudinal slowdown per unit uphill gradient
  v_max: 1.39              # operational max linear speed [m/s] (~5 km/h, indicator 10)
  w_max: 0.8               # max yaw rate [rad/s]
  a_max: 0.6               # max linear acceleration [m/s^2]
  alpha_max: 1.2           # max yaw acceleration [rad/s^2]
  kappa_max: 1.0           # max path curvature [1/m]
  # primitive generation
  horizon: 0.9             # integration horizon per primitive [s]
  dt: 0.05                 # integration step [s]
  curvature_samples: 3     # turn levels per side (excludes straight)
  enable_reverse: true
  enable_in_place: true
